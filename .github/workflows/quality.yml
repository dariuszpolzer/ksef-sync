name: quality

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Tests
        run: uv run python -m pytest

      - name: Ruff
        run: uv run python -m ruff check .

      - name: Black
        run: uv run python -m black --check main.py config.py ksef tests

      - name: Bandit
        run: uv run python -m bandit -q -c pyproject.toml -r .
